<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5845" id="metaTheme">
<title>Документация БМ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<script>
/* оформление: «em» — изумрудное, «coal» — угольное; тот же ключ, что в приложении учёта */
(function(){ var t='em'; try{ t=localStorage.getItem('ui_theme')||'em'; }catch(e){}
  if(t==='coal') document.documentElement.setAttribute('data-theme','coal'); })();
</script>
<style>
  :root{
    /* Борисовские мануфактуры: изумрудный + пепельно-серый */
    --em:#00805F; --emDark:#0B5845; --emLight:#E1F2EC; --ash:#B2BEB5; --ashDark:#5E6B65;
    --bg:#EEF1EF; --card:#FFFFFF; --ink:#1D2622; --muted:#66706B; --line:#D3DAD5;
    --warn:#8A5A00; --warnbg:#FFF3D6; --bad:#C62828; --badbg:#FDE7E7; --press:#CCD5D0;
    --radius:16px; --fs:17px;
  }
  /* Тема «Угольная»: угольный чёрный + пыльный белый */
  :root[data-theme="coal"]{
    --em:#2B2D2F; --emDark:#1C1D1F; --emLight:#ECE7DF; --ash:#E6E0D6; --ashDark:#6B6760;
    --bg:#F4F1EB; --card:#FFFDF9; --ink:#1C1D1F; --muted:#6E6A63; --line:#DCD5CA; --press:#D8D1C5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:400 var(--fs)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  .hidden{display:none !important}

  header{position:sticky;top:0;z-index:5;background:var(--emDark);color:#fff;
         padding:calc(9px + env(safe-area-inset-top)) 12px 9px;display:flex;align-items:center;gap:8px}
  header .logo{height:34px;width:auto;display:block;color:#fff;cursor:pointer}
  header .sp{flex:1}
  .hb{height:38px;min-width:38px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);
      color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;cursor:pointer;font-size:14px;font-weight:700}
  .hb:active{background:rgba(255,255,255,.3)}
  .hb svg{width:20px;height:20px;display:block}
  .hb.round{width:38px;padding:0}
  #userBtn span{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:380px){ header{padding-left:8px;padding-right:8px;gap:6px} header .logo{height:28px} .hb{height:34px;min-width:34px} .hb.round{width:34px} #userBtn span{display:none} }

  main{max-width:760px;margin:0 auto;padding:14px 16px calc(32px + env(safe-area-inset-bottom))}
  .ptitle{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .back{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .back:active{background:var(--press)}
  .back svg{width:22px;height:22px}
  .ptitle h1{margin:0;font-size:21px;line-height:1.25;font-weight:700}
  .ptitle small{display:block;font-size:14px;font-weight:500;color:var(--muted)}

  /* language */
  .hello{text-align:center;padding:16px 4px 4px}
  .hello h2{margin:0;font-size:22px;line-height:1.35;font-weight:700}
  .hello h2 span{display:block;color:var(--muted);font-size:18px;font-weight:500}
  .langs{display:grid;gap:12px;margin-top:20px}
  .lang{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;background:var(--card);
        border:2px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-height:76px}
  .lang:active{background:var(--press)}
  .lang.last{border-color:var(--em)}
  .lang .code{flex:none;width:48px;height:48px;border-radius:12px;background:var(--emLight);color:var(--em);
              display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .lang b{display:block;font-size:21px;font-weight:700}
  .lang em{display:block;font-style:normal;color:var(--muted);font-size:14.5px}
  .arr{margin-left:auto;color:var(--ashDark);flex:none}

  /* list */
  .search{position:relative;display:block;margin:0 0 18px}
  .search input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
                padding:0 14px 0 44px;font:inherit;font-size:16px}
  .search input:focus{outline:2px solid var(--em);outline-offset:1px}
  .search svg{position:absolute;left:14px;top:13px;width:22px;height:22px;color:var(--ashDark)}
  .sec{margin:22px 2px 10px;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .sec:first-child{margin-top:4px}
  .cards{display:grid;gap:10px}
  .card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;background:var(--card);
        border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-height:78px}
  .card:active{background:var(--press)}
  .card .ic{position:relative;flex:none;width:48px;height:48px;border-radius:14px;background:var(--em);color:#fff;display:flex;align-items:center;justify-content:center}
  .card .ic svg{width:26px;height:26px}
  .card .lk{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--card);color:var(--ink);
            border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .card .lk svg{width:14px;height:14px}
  .card b{display:block;font-size:19px;font-weight:700;line-height:1.25}
  .card em{display:block;font-style:normal;color:var(--muted);font-size:14.5px;line-height:1.35;margin-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 8px;color:var(--warn);background:var(--warnbg)}
  .tag.pin{color:var(--ink);background:var(--emLight)}
  .tag.no{color:var(--bad);background:var(--badbg)}
  .empty{color:var(--muted);text-align:center;padding:30px 0}

  /* PIN */
  .pinbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;text-align:center}
  .pinbox .lockbig{width:56px;height:56px;margin:0 auto 8px;border-radius:16px;background:var(--emLight);color:var(--em);display:flex;align-items:center;justify-content:center}
  .pinbox .lockbig svg{width:30px;height:30px}
  .pinbox h2{margin:4px 0 4px;font-size:21px}
  .pinbox p{margin:0 0 14px;color:var(--muted);font-size:15.5px}
  .dots{display:flex;justify-content:center;gap:12px;margin:6px 0 10px;min-height:22px}
  .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ashDark)}
  .dots i.f{background:var(--ink);border-color:var(--ink)}
  .pinmsg{min-height:24px;font-size:15px;font-weight:600;color:var(--bad);margin-bottom:6px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
  .pad button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:26px;font-weight:600;cursor:pointer}
  .pad button:active{background:var(--press)}
  .pad .ok{background:var(--em);border-color:var(--em);color:#fff;font-size:18px;font-weight:700}
  .pad .ok:disabled{opacity:.45}
  .pad .del svg{width:26px;height:26px;display:block;margin:auto}

  /* document */
  .note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:15px;margin:0 0 12px}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:0 0 12px}
  .meta .sp{flex:1}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:10px;height:38px;min-width:44px;padding:0 10px;cursor:pointer;font-weight:700;font-size:15px}
  .chip:active{background:var(--press)}
  .chip.on{background:var(--em);border-color:var(--em);color:#fff}
  article{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 18px 18px;overflow-wrap:anywhere}
  article h1{font-size:1.35em;line-height:1.3;margin:.7em 0 .5em}
  article h2{font-size:1.15em;line-height:1.3;margin:1.4em 0 .5em;padding-top:.9em;border-top:1px solid var(--line);color:var(--em)}
  article h3{font-size:1.04em;margin:1.2em 0 .4em}
  article p{margin:.6em 0}
  article ul,article ol{padding-left:1.25em;margin:.5em 0}
  article li{margin:.35em 0}
  article blockquote{margin:1em 0;padding:10px 14px;border-left:4px solid var(--em);background:var(--emLight);border-radius:0 10px 10px 0}
  article blockquote p{margin:.2em 0}
  .tw{overflow-x:auto;margin:.9em -4px;-webkit-overflow-scrolling:touch}
  article table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92em}
  article th,article td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
  article th{background:var(--emLight)}
  article img{max-width:100%;height:auto;border-radius:8px}
  .filecard{text-align:center;padding:26px 8px}
  .filecard .fic{width:64px;height:64px;margin:0 auto 10px;border-radius:16px;background:var(--emLight);color:var(--em);display:flex;align-items:center;justify-content:center}
  .filecard .fic svg{width:34px;height:34px}
  .filecard b{display:block;font-size:17px;margin-bottom:4px;word-break:break-word}
  .filecard span{display:block;color:var(--muted);font-size:14px;margin-bottom:14px}
  .bigbtn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 22px;border-radius:14px;border:0;background:var(--em);color:#fff;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none}
  .tag.type{color:var(--ashDark);background:var(--bg);border:1px solid var(--line)}
  .tag.hit{color:var(--em);background:var(--emLight)}
  .sync{color:var(--muted);font-size:13px;text-align:center;margin:-6px 0 12px;min-height:18px}
  .loading{color:var(--muted);text-align:center;padding:40px 0}
  .err{color:var(--warn);background:var(--warnbg);border-radius:12px;padding:14px;text-align:center}
  .err.bad{color:var(--bad);background:var(--badbg)}
  .err p{margin:0 0 10px}
  .foot{color:var(--ashDark);font-size:12.5px;text-align:center;margin-top:24px}

  /* sheet + toast */
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 2px;font-size:19px}
  .sheet p{margin:0 0 16px;color:var(--muted)}
  .sheet .btn{display:block;width:100%;height:52px;border-radius:14px;border:0;font-weight:700;font-size:17px;cursor:pointer;margin-top:8px}
  .sheet .btn.out{background:var(--badbg);color:var(--bad)}
  .sheet .btn.cancel{background:var(--bg)}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
         background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;max-width:92%;text-align:center;
         opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  @media print{ header,.meta,.search,.foot,.back{display:none !important} article{border:0;padding:0} body{background:#fff;color:#000} }
</style>
</head>
<body>

  var textHits = {}, searchTimer = null, lastQ = "";

      var docs = CAT.documents.filter(function(d){

  /* PIN-клавиатура */

  function renderPin(lang, d){

        b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 5M12 9l5 5"/></svg>'; }

  function drawDots(){

  /* ---------- документ ---------- */

  function saveDocCache(key, obj){

    if(!store.set(key, s)){            // память переполнена — убираем старые копии
      try { Object.keys(localStorage).filter(function(k){ return k.indexOf("bm.doc.") === 0; }).forEach(function(k){ localStorage.removeItem(k); }); } catch(e){}
      store.set(key, s);
    }

  var loadSeq = 0;

    var d = findDoc(id);

        waitingDoc = true; setTop(" ", "", lang, true, true);

        $("doc").innerHTML = '<p class="loading"></p>'; $("doc").firstChild.textContent = t("loading", lang);
        show("vDoc"); return;

      go("#/" + lang); return;
    }
    waitingDoc = false;
    var closed = d.access === "pin";
    if(closed && !AUTH){ renderPin(lang, d); return; }

    var useLang = hasLang(d, lang) ? lang : (hasLang(d, "ru") ? "ru" : d.langs[0]);
    setTop(pick(d.title, lang), hasLang(d, lang) ? "" : t("onlyRu", lang), lang, true, true);
    var note = $("docNote"); note.classList.toggle("hidden", hasLang(d, lang)); note.textContent = t("onlyRuNote", lang);
    $("docVer").textContent = d.updated ? t("upd", lang) + " " + fmtDate(d.updated) : "";
    var art = $("doc");
    var seq = ++loadSeq;

    var ck = cacheKey(d, useLang), cached = null;
    if(!closed){ try { cached = JSON.parse(store.get(ck) || "null"); } catch(e){} }
    if(cached && cached.updated === d.updated){ paint(art, cached, lang); show("vDoc"); return; }

    art.innerHTML = '<p class="loading"></p>'; art.firstChild.textContent = t("loading", lang);
    show("vDoc");
    api({action:"doc", id:d.id, lang:useLang, token: AUTH ? AUTH.token : ""})
      .then(function(j){
        if(seq !== loadSeq) return;
        if(j.access && AUTH){ AUTH.all = !!j.access.all; AUTH.docs = j.access.docs || []; saveAuth(AUTH); }
        paint(art, j, lang);
        if(!closed && j.kind !== "file") saveDocCache(ck, {updated:d.updated, kind:j.kind, text:j.text, html:j.html});
      })
      .catch(function(e){
        if(seq !== loadSeq) return;
        var code = e && e.code;
        if(code === "expired" || code === "inactive"){ saveAuth(null); renderPin(lang, d); return; }
        if(code === "no_access" && AUTH){ AUTH.docs = (AUTH.docs || []).filter(function(x){ return x !== d.id; }); AUTH.all = false; saveAuth(AUTH); }
        if(cached && code === "net"){ paint(art, cached, lang); toast(t("offline", lang)); return; }
        var msg = code === "no_access" ? t("noAccess", lang) : code === "no_file" ? t("noFile", lang) :
                  code === "not_connected" ? t("notConnected", lang) : t("err", lang);
        art.innerHTML = '<div class="err' + (code === "no_access" ? ' bad' : '') + '"><p></p></div>';
        art.querySelector("p").textContent = msg;
        if(code === "net" || code === "server" || !code){
          var rb = document.createElement("button"); rb.className = "chip on"; rb.textContent = t("retry", lang);
          rb.onclick = function(){ renderDoc(lang, id); }; art.querySelector(".err").appendChild(rb);
        }

  function paint(art, j, lang){

      sanitize(art);

      art.innerHTML = "";

    } else if(j.kind === "file"){
      paintFile(art, j, lang); return;
    }
    art.querySelectorAll("table").forEach(function(tb){ var w = document.createElement("div"); w.className = "tw"; tb.parentNode.insertBefore(w, tb); w.appendChild(tb); });
    art.querySelectorAll("a[href]").forEach(function(a){ a.target = "_blank"; a.rel = "noopener"; });
  }

  function paintFile(art, j, lang){
    art.innerHTML = "";
    if(j.tooBig || !j.b64){ var e = document.createElement("div"); e.className = "err"; e.textContent = t("tooBig", lang); art.appendChild(e); return; }
    var bin = atob(j.b64), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], {type: j.mime || "application/octet-stream"}));
    if(/^image\//.test(j.mime || "")){
      var img = document.createElement("img"); img.src = url; img.alt = j.name || ""; img.style.display = "block"; img.style.margin = "12px auto";
      art.appendChild(img); return;
    }
    var box = document.createElement("div"); box.className = "filecard";
    var isPdf = /pdf/.test(j.mime || "");
    box.innerHTML = '<div class="fic">' + SV + (isPdf ? ICONS.pdf : ICONS.file) + '</svg></div><b></b><span></span>';
    box.querySelector("b").textContent = j.name || "";
    box.querySelector("span").textContent = Math.max(1, Math.round((j.size || 0) / 1024)) + " КБ";
    var a = document.createElement("a"); a.className = "bigbtn"; a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = isPdf ? t("open", lang) : t("download", lang);
    if(!isPdf) a.download = j.name || "file";
    box.appendChild(a); art.appendChild(box);
  }

  /* Google Документ → чистая разметка: жирный/курсив сохраняем, оформление Google убираем */
  function cleanGdoc(html){
    var doc = new DOMParser().parseFromString(html, "text/html");
    var css = Array.prototype.map.call(doc.querySelectorAll("style"), function(s){ return s.textContent; }).join("\n");
    var bold = {}, ital = {}, under = {};
    css.replace(/\.([\w-]+)\{([^}]*)\}/g, function(m, cls, body){
      if(/font-weight:\s*(700|800|900|bold)/.test(body)) bold[cls] = 1;
      if(/font-style:\s*italic/.test(body)) ital[cls] = 1;
      if(/text-decoration:\s*underline/.test(body)) under[cls] = 1;
      return m;
    });
    Array.prototype.slice.call(doc.querySelectorAll("span")).forEach(function(sp){
      var cls = (sp.getAttribute("class") || "").split(/\s+/);
      var inLink = sp.closest("a");
      var node = doc.createDocumentFragment();
      while(sp.firstChild) node.appendChild(sp.firstChild);
      function wrap(tag){ var el = doc.createElement(tag); el.appendChild(node); var f = doc.createDocumentFragment(); f.appendChild(el); node = f; }
      if(cls.some(function(c){ return bold[c]; })) wrap("strong");
      if(cls.some(function(c){ return ital[c]; })) wrap("em");
      if(!inLink && cls.some(function(c){ return under[c]; })) wrap("u");
      sp.parentNode.replaceChild(node, sp);
    });
    Array.prototype.slice.call(doc.querySelectorAll("a[href]")).forEach(function(a){
      var m = a.getAttribute("href").match(/^https:\/\/www\.google\.com\/url\?q=([^&]+)/);
      if(m){ try { a.setAttribute("href", decodeURIComponent(m[1])); } catch(e){} }
    });
    var body = doc.body;
    sanitize(body);
    Array.prototype.slice.call(body.querySelectorAll("p,h1,h2,h3,h4,h5,h6")).forEach(function(p){
      if(!p.textContent.trim() && !p.querySelector("img")) p.remove();
    });
    var frag = document.createDocumentFragment();
    while(body.firstChild) frag.appendChild(document.importNode(body.firstChild, true)), body.removeChild(body.firstChild);
    return frag;
  }

  /* убираем всё лишнее и опасное: скрипты, стили, обработчики, javascript-ссылки */
  var KEEP = { a:["href"], img:["src","alt"], td:["colspan","rowspan"], th:["colspan","rowspan"], ol:["start"] };
  function sanitize(root){
    Array.prototype.slice.call(root.querySelectorAll("script,style,link,meta,iframe,object,embed,form,input,button")).forEach(function(e){ e.remove(); });
    Array.prototype.slice.call(root.querySelectorAll("*")).forEach(function(el){
      var keep = KEEP[el.tagName.toLowerCase()] || [];
      Array.prototype.slice.call(el.attributes).forEach(function(at){ if(keep.indexOf(at.name) === -1) el.removeAttribute(at.name); });
      ["href","src"].forEach(function(n){ var v = el.getAttribute(n); if(v && /^\s*(javascript|vbscript|data:text)/i.test(v)) el.removeAttribute(n); });
    });
  }

  function render(){
    var r = currentRoute();
    if(!r.lang){ renderLang(); return; }
    store.set("bm.lang", r.lang);
    if(r.doc){ renderDoc(r.lang, r.doc); } else { renderList(r.lang); }
  }
  function applyFs(){ fs = Math.max(14, Math.min(26, fs)); document.documentElement.style.setProperty("--fs", fs + "px"); store.set("bm.fs", String(fs)); }

  /* ---------- события ---------- */
  $("back").onclick = function(){ go("#/" + L()); };
  $("home").onclick = function(){ if(currentRoute().lang) go("#/" + L()); };
  $("langBtn").onclick = function(){ var r = currentRoute(); if(r.doc) qrDoc = r.doc; go("#/"); };
  $("fsMinus").onclick = function(){ fs -= 2; applyFs(); };
  $("fsPlus").onclick = function(){ fs += 2; applyFs(); };
  window.addEventListener("hashchange", render);

  /* ---------- запуск ---------- */
  try { CAT = JSON.parse(store.get("bm.cat") || "null"); } catch(e){ CAT = null; }
  fetch("catalog.json", {cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(c){ API = c.accessApi || ""; })
    .catch(function(){ API = store.get("bm.api") || ""; })
    .then(function(){
      if(API) store.set("bm.api", API);
      if((!location.hash || location.hash === "#" || location.hash === "#/") && qrLang && UI[qrLang]){ chooseLang(qrLang); } else { render(); }
      if(!API){ CAT = CAT || {sections:[], documents:[]}; catOffline = false; $("sync").textContent = t("notConnected", L()); render(); return; }
      function after(){ var r = currentRoute(); if(r.lang && (!r.doc || waitingDoc)) render(); }
      loadCatalog().then(after, function(){ if(!CAT) CAT = {sections:[], documents:[]}; after(); });
    });

  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
